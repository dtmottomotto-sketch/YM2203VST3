name: Build VST3 Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install JUCE
      run: |
        cd C:\
        git clone --depth 1 --branch 7.0.9 https://github.com/juce-framework/JUCE.git JUCE
        
    - name: Setup Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v1.1
      with:
        vs-version: '17.x'

    - name: Generate Visual Studio Project with Projucer
      run: |
        $JUCE_PATH = "C:\JUCE"
        $PROJUCER_PATH = "$JUCE_PATH\extras\Projucer\Builds\VisualStudio2022\x64\Release\Projucer.exe"
        $PROJECT_FILE = "${{ github.workspace }}\YM2203Synth.jucer"
        
        # Run Projucer in headless mode to generate Visual Studio project
        & $PROJUCER_PATH --resave "$PROJECT_FILE"

    - name: Build with MSBuild
      run: |
        $VS_PROJECT = "${{ github.workspace }}\Builds\VisualStudio2022\YM2203Synth.sln"
        msbuild "$VS_PROJECT" /p:Configuration=Release /p:Platform=x64

    - name: Copy VST3 Plugin
      run: |
        $VST3_SRC = "${{ github.workspace }}\Builds\VisualStudio2022\x64\Release\VST3\YM2203Synth.vst3"
        $VST3_DEST = "${{ github.workspace }}\YM2203Synth.vst3"
        
        if (Test-Path $VST3_SRC) {
          Copy-Item -Path $VST3_SRC -Destination $VST3_DEST -Recurse -Force
          Write-Host "VST3 plugin copied successfully"
        } else {
          Write-Host "Error: VST3 plugin not found at $VST3_SRC"
          exit 1
        }

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v3
      with:
        name: YM2203Synth-VST3
        path: ${{ github.workspace }}\YM2203Synth.vst3

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ github.workspace }}\YM2203Synth.vst3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Release (Build Artifacts)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v3
      with:
        name: YM2203Synth-Latest-Build
        path: ${{ github.workspace }}\YM2203Synth.vst3
        retention-days: 30
