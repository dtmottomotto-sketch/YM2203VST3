name: Build VST3 Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install JUCE
      run: |
        cd C:\
        git clone --depth 1 --branch 7.0.9 https://github.com/juce-framework/JUCE.git JUCE
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        vs-version: 17.0
    
    - name: Generate Project with Projucer
      run: |
        $JUCE_PATH = "C:\JUCE"
        $PROJUCER = "$JUCE_PATH\extras\Projucer\Builds\VisualStudio2022\x64\Release\Projucer.exe"
        $PROJECT_FILE = "${{ github.workspace }}\YM2203Synth.jucer"
        Write-Host "Running Projucer: $PROJUCER"
        Write-Host "Project file: $PROJECT_FILE"
        & $PROJUCER --resave "$PROJECT_FILE"
    
    - name: Build VST3
      run: |
        msbuild "${{ github.workspace }}\Builds\VisualStudio2022\YM2203Synth.sln" /p:Configuration=Release /p:Platform=x64
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YM2203Synth-VST3
        path: ${{ github.workspace }}\Builds\VisualStudio2022\x64\Release\VST3\
        retention-days: 30
